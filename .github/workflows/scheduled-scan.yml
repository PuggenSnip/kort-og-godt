# Scheduled headless price scan -> shared DB (+ Discord ping on new BUYs).
#
# Politeness: ~8 runs/day x ~55 sources at max 1 request/second/domain is well
# inside the app's own policy (robots.txt respected, identifying User-Agent,
# 1h response cache — so back-to-back runs are mostly cache hits). The extra
# slots are redundancy against GitHub's best-effort scheduler dropping runs,
# not more load. Do not increase the frequency further without rethinking that.
#
# Requires two repository Actions secrets (Settings -> Secrets and variables
# -> Actions): DATABASE_URL (the shared Supabase Postgres, same value as the
# Streamlit secret) and DISCORD_WEBHOOK_URL (optional -> no pings, scan only).
name: Scheduled scan

on:
  schedule:
    - cron: "17 */3 * * *"          # every 3h at :17 (8x/day) — redundant vs
                                     # GitHub dropping best-effort scheduled runs
  workflow_dispatch: {}             # manual runs from the Actions tab

permissions:
  contents: read

concurrency:
  group: scheduled-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scan_cli.py
