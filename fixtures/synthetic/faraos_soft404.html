<!DOCTYPE html>
<html lang="da">
<head>
  <!-- Dead/removed product slug: Faraos returns HTTP 200 but renders the
       parent CATEGORY, and og:url points at that category, not the request. -->
  <meta property="og:url" content="https://www.faraos.dk/games/x">
  <meta property="og:title" content="Kortspil | Faraos Webshop">
  <meta property="og:type" content="website">
  <title>Faraos</title>
</head>
<body>
  <h1>Kortspil</h1>
  <div class="itemslider-item" data-price="1234.00">A category listing tile — not the requested product.</div>
</body>
</html>
